[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-calc"
dynamic = ["version"]
description = "Price your Claude Code session logs and view the spend in a local dashboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Hassan Ibrahim", email = "eng.hibrahem@gmail.com" }]
keywords = ["claude", "claude-code", "anthropic", "cost", "tokens", "dashboard"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hibrahem/claude-calc"
Issues = "https://github.com/hibrahem/claude-calc/issues"

[project.scripts]
claude-calc = "claude_calc.cli:main"

[tool.setuptools]
packages = ["claude_calc"]

[tool.setuptools.dynamic]
version = { attr = "claude_calc.__version__" }

[tool.setuptools.package-data]
claude_calc = ["static/*"]
